name: ask_my_data_starter
description: >
  Ask My Data workshop starter — DevFest Florida Hackathon 2026.
  UI-only chat app. No Firebase yet; that's Module 0.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# --- Module 0 checkpoint -----------------------------------------------
# Once you've created a Firebase project and run `flutterfire configure`,
# add the Firebase packages with:
#
#   flutter pub add firebase_core cloud_firestore firebase_ai
#
# Using `flutter pub add` instead of hand-typing versions here keeps you
# on whatever is current when you run the workshop.
# -------------------------------------------------------------------------
